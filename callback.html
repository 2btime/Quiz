<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 로그인 콜백</title>
    <!-- jQuery를 먼저 로드 -->
    <script type="text/javascript" src="http://code.jquery.com/jquery-1.11.3.min.js"></script>
    <!-- 네이버 로그인 JavaScript 라이브러리 -->
    <script type="text/javascript" src="http://static.nid.naver.com/js/naverLogin_implicit-1.0.3.js" charset="utf-8"></script>
</head>
<body>
    <script type="text/javascript">
        // 네이버 로그인 객체 생성
        var naver_id_login = new naver_id_login("PzuEelADiaR3ATkjpTo3", "http://127.0.0.1:5500/10_wordQuiz/callback.html");
        
        // 사용자 프로필 가져오기
        naver_id_login.get_naver_userprofile("naverSignInCallback()");

        // 네이버 사용자 정보 콜백 함수
        function naverSignInCallback() {
            // 사용자 프로필 정보 가져오기
            var name = naver_id_login.getProfileData('name');

            if (name) {
                // 부모 창으로 사용자 이름을 전달하여 세션 스토리지에 저장
                if (window.opener) {
                    // 부모 창의 세션 스토리지에 사용자 이름 저장
                    window.opener.sessionStorage.setItem("userName", name);
                    // 부모 창에서 index 페이지로 이동
                    window.opener.location.href = "http://127.0.0.1:5500/10_wordQuiz/index.html";
                    // 팝업 창 닫기
                    window.close();
                } else {
                    // 팝업이 아닌 경우 현재 창에서 이동
                    sessionStorage.setItem("userName", name);
                    window.location.href = "http://127.0.0.1:5500/10_wordQuiz/index.html";
                }
            } else {
                alert("로그인에 실패했습니다. 사용자 정보를 가져오지 못했습니다.");
            }
        }
    </script>
</body>
</html>
